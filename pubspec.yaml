name: frequenza
description: "Ascolto e scoperta di web radio nel mondo."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  easy_localization: ^3.0.8
  go_router: ^14.8.1
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.4
  http: ^1.2.2
  just_audio: ^0.9.44
  audio_service: ^0.18.19
  audio_session: ^0.1.25

  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.4
  freezed: ^2.5.8
  json_serializable: ^6.9.5
  build_runner: ^2.5.4

flutter:
  # `flutter run` e le build senza --flavor usano la versione dev.
  default-flavor: dev
  uses-material-design: true
